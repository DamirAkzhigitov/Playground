name = "apartments-api"
main = "src/index.ts"
compatibility_date = "2026-05-11"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[[routes]]
pattern = "compare.da-mr.com"
zone_name = "da-mr.com"
custom_domain = true

# Vite client build output (apps/compare/dist). Same Worker serves SPA + /api — no CORS.
[assets]
directory = "../dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "apartments-db"
database_id = "6b2a6bb6-64b3-4f31-a1da-959f1169b87b"
migrations_dir = "migrations"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "playground-auth-db"
database_id = "19af03aa-ae46-4c24-9729-fca5941d73bb"
migrations_dir = "../../../packages/auth-core/migrations"

[vars]
AUTH_COOKIE_DOMAIN = ".da-mr.com"
BETTER_AUTH_TRUSTED_ORIGINS = "https://auth.da-mr.com,https://compare.da-mr.com,https://steps.da-mr.com"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "apartments-photos"
jurisdiction = "eu"

# SSO: shared AUTH_DB + AUTH_COOKIE_DOMAIN (vars above). Use the same BETTER_AUTH_SECRET on
# compare and steps Workers. See packages/auth-core/SSO.md.

[observability]
enabled = true

[observability.logs]
enabled = true

# Production deploy: wrangler deploy. Dev deploy: wrangler deploy --env dev
# Dev: R2 `apartments-photos-dev`, Worker `apartments-api-dev`, domain dev-compare.da-mr.com.
[env.dev]
name = "apartments-api-dev"

[[env.dev.routes]]
pattern = "dev-compare.da-mr.com"
zone_name = "da-mr.com"
custom_domain = true

[[env.dev.d1_databases]]
binding = "DB"
database_name = "apartments-db-dev"
database_id = "bac8f817-afe9-475b-9165-34a926e9bd40"
migrations_dir = "migrations"

[[env.dev.d1_databases]]
binding = "AUTH_DB"
database_name = "playground-auth-db-dev"
database_id = "62c9747d-6d66-420f-93ff-d66fcecf29d1"
migrations_dir = "../../../packages/auth-core/migrations"

[env.dev.vars]
BETTER_AUTH_TRUSTED_ORIGINS = "https://dev-auth.da-mr.com,https://dev-compare.da-mr.com,https://dev-steps.da-mr.com,http://localhost:3002,http://127.0.0.1:3002,http://localhost:3003,http://127.0.0.1:3003,http://localhost:3004,http://127.0.0.1:3004"

[[env.dev.r2_buckets]]
binding = "PHOTOS"
bucket_name = "apartments-photos-dev"
jurisdiction = "eu"

# Same SPA + /api layout as prod; required on `wrangler deploy --env dev` so ASSETS is provisioned.
[env.dev.assets]
directory = "../dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]
