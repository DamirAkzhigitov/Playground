name = "playground-auth-api"
main = "src/index.ts"
compatibility_date = "2026-05-11"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[[routes]]
pattern = "auth.da-mr.com"
zone_name = "da-mr.com"
custom_domain = true

[assets]
directory = "../dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "AUTH_DB"
database_name = "playground-auth-db"
database_id = "19af03aa-ae46-4c24-9729-fca5941d73bb"
migrations_dir = "../../../packages/auth-core/migrations"

# `DB` required by auth-core; same D1 as AUTH_DB for this Worker.
[[d1_databases]]
binding = "DB"
database_name = "playground-auth-db"
database_id = "19af03aa-ae46-4c24-9729-fca5941d73bb"
migrations_dir = "../../../packages/auth-core/migrations"

[vars]
AUTH_COOKIE_DOMAIN = ".da-mr.com"
BETTER_AUTH_TRUSTED_ORIGINS = "https://auth.da-mr.com,https://compare.da-mr.com,https://steps.da-mr.com"

[observability]
enabled = true

[observability.logs]
enabled = true

[env.dev]
name = "playground-auth-api-dev"

[[env.dev.routes]]
pattern = "dev-auth.da-mr.com"
zone_name = "da-mr.com"
custom_domain = true

[[env.dev.d1_databases]]
binding = "AUTH_DB"
database_name = "playground-auth-db-dev"
database_id = "62c9747d-6d66-420f-93ff-d66fcecf29d1"
migrations_dir = "../../../packages/auth-core/migrations"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "playground-auth-db-dev"
database_id = "62c9747d-6d66-420f-93ff-d66fcecf29d1"
migrations_dir = "../../../packages/auth-core/migrations"

[env.dev.vars]
BETTER_AUTH_TRUSTED_ORIGINS = "https://dev-auth.da-mr.com,https://dev-compare.da-mr.com,https://dev-steps.da-mr.com,http://localhost:3002,http://127.0.0.1:3002,http://localhost:3003,http://127.0.0.1:3003,http://localhost:3004,http://127.0.0.1:3004"

[env.dev.assets]
directory = "../dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]
