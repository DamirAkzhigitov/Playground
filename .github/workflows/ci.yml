name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type check
        run: pnpm turbo run type-check

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm turbo run build

      - name: Verify build output
        run: |
          if [ ! -d "apps/compare-next/.next" ]; then
            echo "Error: apps/compare-next/.next not found after build"
            exit 1
          fi
          echo "Build output verified at apps/compare-next/.next/"

  e2e:
    name: E2E (compare-next)
    if: false # Temporarily skipped — re-enable when E2E is stable in CI
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: compare-next E2E
        run: pnpm test:e2e
        env:
          CI: true
