name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      git_ref:
        description: SHA or branch already on origin to deploy to compare-next-dev (never production). Leave empty to deploy the branch this workflow is run from.
        required: false
        type: string

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'deploy-dev-live' || (github.event_name == 'pull_request' && format('deploy-dev-pr-{0}', github.event.pull_request.number) || format('deploy-prod-{0}', github.sha)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      compare: ${{ steps.filter.outputs.compare }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Enough history for dorny/paths-filter to diff push.before..HEAD reliably.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Same branch as the push: compare only against the previous tip (paths-filter README).
          # Omit deploy.yml from filters below: one workflow edit matches every app otherwise.
          base: ${{ github.ref }}
          filters: |
            compare:
              - 'apps/compare-next/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

  deploy-compare:
    name: Deploy apps/compare-next (OpenNext Worker)
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.detect-changes.outputs.compare == 'true'
    environment:
      name: production
      url: https://compare.da-mr.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy @playground/compare-next to Cloudflare
        run: pnpm --filter @playground/compare-next run deploy
        env:
          NEXT_PUBLIC_SITE_URL: https://compare.da-mr.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-compare-dev:
    name: Deploy apps/compare-next (OpenNext Worker, dev)
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.detect-changes.outputs.compare == 'true'
    environment:
      name: development
      url: https://dev-compare.da-mr.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy @playground/compare-next to Cloudflare (dev)
        run: pnpm --filter @playground/compare-next run deploy:dev
        env:
          NEXT_PUBLIC_SITE_URL: https://dev-compare.da-mr.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-compare-dev-dispatch:
    name: Deploy apps/compare-next (OpenNext Worker, dev, dispatched SHA)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    environment:
      name: development
      url: https://dev-compare.da-mr.com

    steps:
      # Do not pass `ref:` into checkout. It glob-fetches refs/heads/<name>*
      # and fails with a silent git exit 1 when the branch is missing (typical
      # for unpushed Cursor agent branches). Checkout the workflow's own
      # commit first, then fetch the input as an exact SHA or branch.
      - name: Checkout workflow ref
        uses: actions/checkout@v5

      - name: Fetch and check out dispatched ref
        if: ${{ inputs.git_ref }}
        env:
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          ref="$(printf '%s' "$GIT_REF" | tr -d '[:space:]')"
          echo "Fetching git_ref=${ref} from origin"

          if ! git fetch --no-tags --depth=1 origin "${ref}"; then
            echo "::error::git_ref '${ref}' is not on origin. Push that SHA or branch to GitHub, then re-run Deploy. A local Cursor branch cannot be checked out from Actions."
            exit 1
          fi

          git checkout --detach FETCH_HEAD
          echo "Checked out $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy @playground/compare-next to Cloudflare (dev)
        run: pnpm --filter @playground/compare-next run deploy:dev
        env:
          NEXT_PUBLIC_SITE_URL: https://dev-compare.da-mr.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
